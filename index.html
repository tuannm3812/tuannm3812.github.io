    <script>
      // Applies the stored theme before first paint. useTheme() sets the same class,
      // but only in an effect that runs after React mounts -- long enough for dark-mode
      // visitors to see a white flash on every load.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme =
            saved ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
