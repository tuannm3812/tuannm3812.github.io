name: Sync GitHub Projects

# Manual only (Mike, 18 Nov). Every new project needs a hand-written card in
# src/data/projectCards.ts, so a scheduled run could only go red. Run this from
# the Actions tab (or ask an agent to sync projects): it refreshes the generated
# metadata and opens a pull request for review instead of pushing to main.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync generated project data
        run: npm run sync:github-projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: tuannm3812
          GITHUB_PROJECT_IGNORE: adv_mla_lab_2,adv_mla_lab_3,tuannm3812

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Open a pull request with the changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet src/data/githubProjects.ts; then
            echo "No changes in synced projects."
            exit 0
          fi
          branch="sync/github-projects-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data/githubProjects.ts
          git commit -m "chore: sync github projects"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Sync GitHub projects $(date -u +%Y-%m-%d)" \
            --body "Generated by the Sync GitHub Projects workflow. Review the card changes before merging: merging deploys the live site."
