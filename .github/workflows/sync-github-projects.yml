name: Sync GitHub Projects

on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync generated project data
        run: npm run sync:github-projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: tuannm3812
          GITHUB_PROJECT_IGNORE: adv_mla_lab_2,adv_mla_lab_3,tuannm3812

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Commit and push changes
        run: |
          if git diff --quiet src/data/githubProjects.ts; then
            echo "No changes in synced projects."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/githubProjects.ts
          git commit -m "chore: sync github projects"
          git push
